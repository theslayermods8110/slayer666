<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SLAYER MODZ - Obtener Licencia</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
  body{
    min-height:100vh;
    background: linear-gradient(to bottom, #000000 0%, #000000 45%, #4d0000 70%, #b30000 100%);
    display:flex; justify-content:center; align-items:center;
    padding:20px; color:white;
  }
  .card{
    width:100%; max-width:420px;
    text-align:center;
  }
  .goku{
    width:230px; height:280px; margin:0 auto 10px;
    background: #111;
    border-radius:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:90px;
    box-shadow:0 0 40px #ff0000;
    overflow:hidden;
    background-image:url('fondo.png');
    background-size:cover; background-position:top center;
  }
  .goku span{filter:drop-shadow(0 0 10px red);}
  h1{
    font-size:32px; letter-spacing:2px; margin:10px 0 5px;
    background: linear-gradient(to bottom, #ffffff 20%, #ff5a5a 80%, #ff0000);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    text-shadow:0 0 25px rgba(255,0,0,.6);
    -webkit-text-stroke:1px black;
  }
  p.sub{color:#ffb3b3; font-size:14px; margin-bottom:25px; letter-spacing:1px;}
  .box{
    background: rgba(0,0,0,.65);
    border:1px solid #330000;
    border-radius:14px; padding:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    text-align:left;
  }
  label{font-size:12px; letter-spacing:1px; color:#ccc; display:block; margin-bottom:8px;}
  input{
    width:100%; height:52px; background:#000; color:white;
    border:1px solid #333; padding:0 14px; font-size:15px; outline:none;
  }
  input:focus{border-color:#ff0000;}
  .btn{
    width:100%; height:52px; border:none; cursor:pointer;
    font-weight:bold; font-size:15px; letter-spacing:1px; margin-top:12px;
    transition:.2s;
  }
  .btn-red{background:#FF0000; color:white;}
  .btn-red:hover{background:#ff2222; transform:scale(1.01);}
  .btn-gray{background:#333333; color:white;}
  .btn-gray:hover{background:#444;}
  #keyBox{
    display:none; margin-top:15px; background:#000; border:1px dashed #ff0000;
    padding:14px; text-align:center; border-radius:10px;
  }
  #keyText{font-size:18px; font-weight:bold; letter-spacing:2px; color:#ff5555; word-break:break-all;}
  #msg{margin-top:12px; text-align:center; font-size:14px; font-weight:bold; min-height:20px;}
  .ok{color:#00ff88;} .error{color:#ff4444;}
  footer{margin-top:18px; font-size:11px; color:#999; text-align:center;}
</style>
</head>
<body>

<div class="card">
  <!-- Si tienes la imagen de Goku, ponla como fondo.png en la misma carpeta -->
  <div class="goku"><span>😈</span></div>

  <h1>THE SLAYER MODZ</h1>
  <p class="sub">OBTENER LICENCIA • ACCESO PREMIUM</p>

  <div class="box">
    <label>OBTENER LICENCIA</label>
    <input id="inputKey" type="text" placeholder="INGRESA TU KEY">

    <button class="btn btn-red" onclick="getKey()">GET KEY</button>
    <button class="btn btn-gray" onclick="verificar()">VERIFICAR KEY</button>

    <div id="keyBox">
      <div style="font-size:12px;color:#aaa;margin-bottom:6px;">TU LICENCIA ES:</div>
      <div id="keyText"></div>
      <button class="btn btn-red" onclick="copiar()" style="margin-top:10px;">COPIAR KEY</button>
    </div>

    <div id="msg"></div>
  </div>

  <footer>© 2026 THE SLAYER MODZ - Todos los derechos reservados</footer>
</div>

<script>
  let keyGenerada = "";

  function getKey(){
    // Genera una key tipo SLAYER-XXXX-XXXX
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
    let a="", b="";
    for(let i=0;i<4;i++){ a+=chars[Math.floor(Math.random()*chars.length)]; b+=chars[Math.floor(Math.random()*chars.length)]; }
    keyGenerada = "SLAYER-" + a + "-" + b;
    document.getElementById("keyText").innerText = keyGenerada;
    document.getElementById("keyBox").style.display = "block";
    document.getElementById("inputKey").value = keyGenerada;
    document.getElementById("msg").innerHTML = '<span class="ok">✅ Licencia generada. Cópiala y úsala en la app</span>';
  }

  function verificar(){
    const v = document.getElementById("inputKey").value.trim();
    const msg = document.getElementById("msg");
    if(!v){
      msg.innerHTML = '<span class="error">⚠️ Primero ingresa tu KEY</span>';
      return;
    }
    if(v.startsWith("SLAYER-") && v.length >= 12){
      msg.innerHTML = '<span class="ok">✅ KEY CORRECTA - LICENCIA ACTIVADA</span>';
    } else {
      msg.innerHTML = '<span class="error">❌ KEY INCORRECTA</span>';
    }
  }

  function copiar(){
    navigator.clipboard.writeText(keyGenerada);
    document.getElementById("msg").innerHTML = '<span class="ok">📋 Copiada al portapapeles</span>';
  }
</script>

</body>
  </html>
