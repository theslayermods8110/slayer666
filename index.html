
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030705">
    <title>DARK WEB | Control Panel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --neon: #00ff88;
            --neon2: #39ff14;
            --bg: #030705;
            --panel: rgba(3, 10, 6, .98);
            --surface: #07120b;
            --text: #d8ffe8;
            --muted: #79a88d;
            --border: rgba(0, 255, 136, .30);
            --glow: rgba(0, 255, 136, .18);
            --panel-width: 285px;
            --transition: .35s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text);
            background: var(--bg);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible {
            outline: 2px solid var(--neon);
            outline-offset: 4px;
        }

        ::selection {
            background: var(--neon);
            color: #000;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #020503;
        }

        ::-webkit-scrollbar-thumb {
            background: #008f50;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon);
        }

        /* Fondo tecnológico */

        #area-contenido {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                linear-gradient(rgba(0,255,136,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,.035) 1px, transparent 1px),
                radial-gradient(ellipse at center, #0a1b10 0%, #030705 65%, #000 100%);
            background-size: 28px 28px, 28px 28px, auto;
        }

        #area-contenido::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                transparent 50%,
                rgba(0, 255, 136, .018) 50%
            );
            background-size: 100% 4px;
            z-index: 1;
        }

        /* Botón del menú */

        #menu-toggle {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 49px;
            height: 49px;
            z-index: 1002;
            display: grid;
            place-items: center;
            background: #06140c;
            color: var(--neon);
            border: 1px solid var(--neon);
            border-radius: 6px;
            font-size: 21px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,255,136,.12),
                        inset 0 0 12px rgba(0,255,136,.05);
            transition: .3s ease;
        }

        #menu-toggle:hover {
            background: #0b2616;
            box-shadow: 0 0 22px rgba(0,255,136,.3);
            transform: scale(1.05);
        }

        #menu-toggle i {
            text-shadow: 0 0 10px var(--neon);
            transition: transform .5s ease;
        }

        #menu-toggle.icon-rotated i {
            transform: rotate(180deg);
        }

        /* Panel de navegación */

        #panel-navegacion {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--panel-width);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            padding: 88px 20px 25px;
            overflow-y: auto;
            overflow-x: hidden;
            background: var(--panel);
            border-right: 1px solid var(--border);
            box-shadow: 10px 0 35px rgba(0,0,0,.55),
                        4px 0 25px rgba(0,255,136,.04);
            transform: translateX(-105%);
            visibility: hidden;
            transition: transform .4s cubic-bezier(.22,.8,.25,1),
                        visibility 0s linear .4s;
        }

        #panel-navegacion.panel-visible {
            transform: translateX(0);
            visibility: visible;
            transition: transform .4s cubic-bezier(.22,.8,.25,1),
                        visibility 0s;
        }

        /* Encabezado del panel */

        .panel-header {
            padding: 0 5px 24px;
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border);
            opacity: 0;
            transform: translateY(10px);
        }

        .panel-visible .panel-header {
            animation: appear .45s .08s forwards;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            color: var(--neon);
            background: rgba(0,255,136,.06);
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 20px;
            box-shadow: inset 0 0 15px rgba(0,255,136,.04);
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--neon);
            text-shadow: 0 0 12px rgba(0,255,136,.2);
        }

        .brand-subtitle {
            margin-top: 5px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 2px;
        }

        .section-label {
            color: #56836a;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 0 7px;
            margin-bottom: 13px;
        }

        /* Botones */

        .boton-panel {
            width: 100%;
            min-height: 53px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 15px;
            margin-bottom: 11px;
            text-align: left;
            color: var(--text);
            background: rgba(0,255,136,.025);
            border: 1px solid rgba(0,255,136,.17);
            border-radius: 5px;
            cursor: pointer;
            opacity: 0;
            transform: translateX(-12px);
            transition: background .25s ease,
                        border-color .25s ease,
                        box-shadow .25s ease,
                        transform .25s ease;
        }

        .panel-visible .boton-panel {
            animation: appear .45s forwards;
        }

        .panel-visible .boton-panel:nth-of-type(1) {
            animation-delay: .12s;
        }

        .panel-visible .boton-panel:nth-of-type(2) {
            animation-delay: .18s;
        }

        .panel-visible .boton-panel:nth-of-type(3) {
            animation-delay: .24s;
        }

        .panel-visible .boton-panel:nth-of-type(4) {
            animation-delay: .30s;
        }

        .boton-panel i {
            width: 22px;
            flex-shrink: 0;
            text-align: center;
            font-size: 17px;
            color: var(--neon);
            transition: transform .25s ease;
        }

        .button-text {
            flex: 1;
            min-width: 0;
        }

        .button-title {
            display: block;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: .6px;
        }

        .button-description {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            color: var(--muted);
        }

        .button-arrow {
            font-size: 11px !important;
            color: #47765a !important;
        }

        .boton-panel:hover {
            background: rgba(0,255,136,.09);
            border-color: var(--neon);
            box-shadow: 0 0 17px rgba(0,255,136,.07),
                        inset 0 0 12px rgba(0,255,136,.025);
            transform: translateX(3px);
        }

        .boton-panel:hover > i:first-child {
            transform: scale(1.15);
            text-shadow: 0 0 10px var(--neon);
        }

        .boton-panel:active {
            transform: scale(.98);
        }

        .panel-separator {
            height: 1px;
            border: 0;
            margin: 15px 0 22px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0,255,136,.4),
                transparent
            );
        }

        /* Estado del sistema */

        .system-status {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 12px;
            margin-top: 4px;
            background: rgba(0,255,136,.025);
            border: 1px solid rgba(0,255,136,.12);
            border-radius: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            flex-shrink: 0;
            background: var(--neon);
            border-radius: 50%;
            box-shadow: 0 0 9px var(--neon);
            animation: blink 1.5s infinite;
        }

        /* Botón limpiar */

        #boton-inicio {
            margin-top: auto;
            padding-top: 20px;
            opacity: 0;
        }

        .panel-visible #boton-inicio {
            animation: appear .45s .36s forwards;
        }

        #boton-inicio button {
            width: 100%;
            min-height: 46px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #ff8888;
            background: rgba(255,60,60,.035);
            border: 1px solid rgba(255,90,90,.25);
            border-radius: 5px;
            cursor: pointer;
            transition: .25s ease;
        }

        #boton-inicio button:hover {
            background: rgba(255,60,60,.10);
            border-color: #ff7777;
            box-shadow: 0 0 14px rgba(255,60,60,.08);
        }

        /* Pantalla inicial */

        #texto-inicial,
        #iframe-contenido {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 1;
            visibility: visible;
            transition: opacity .35s ease,
                        transform .35s ease,
                        visibility 0s;
        }

        #texto-inicial {
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }

        #texto-inicial.content-hidden,
        #iframe-contenido.content-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .3s ease,
                        transform .3s ease,
                        visibility 0s linear .3s;
        }

        #texto-inicial.content-hidden {
            transform: translateY(15px) scale(.98);
        }

        #iframe-contenido.content-hidden {
            transform: scale(.99);
        }

        .main-icon {
            margin-bottom: 28px;
            font-size: clamp(55px, 10vw, 85px);
            color: var(--neon);
            filter: drop-shadow(0 0 18px rgba(0,255,136,.35));
            animation: floatIcon 4s ease-in-out infinite;
        }

        .welcome-label {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon);
            font-size: clamp(23px, 5vw, 40px);
            letter-spacing: clamp(3px, 1vw, 8px);
            text-shadow: 0 0 20px rgba(0,255,136,.25);
        }

        .welcome-subtitle {
            margin-top: 14px;
            color: #7aa98b;
            font-size: 12px;
            letter-spacing: 3px;
        }

        .terminal-card {
            width: min(100%, 390px);
            margin-top: 30px;
            padding: 19px;
            text-align: left;
            background: rgba(1,8,4,.72);
            border: 1px solid rgba(0,255,136,.2);
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(0,255,136,.035);
        }

        .terminal-top {
            display: flex;
            align-items: center;
            gap: 6px;
            padding-bottom: 12px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(0,255,136,.15);
        }

        .terminal-circle {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1b6e43;
        }

        .terminal-heading {
            margin-left: 6px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        .terminal-line {
            color: #83b997;
            font-family: monospace;
            font-size: 12px;
            line-height: 2;
            overflow-wrap: anywhere;
        }

        .terminal-line strong {
            color: var(--neon);
            font-weight: 400;
        }

        .welcome-hint {
            margin-top: 24px;
            color: var(--muted);
            font-size: 12px;
        }

        .welcome-hint i {
            margin-right: 7px;
            color: var(--neon);
        }

        /* Marco del contenido cargado */

        #iframe-contenido {
            z-index: 3;
            border: none;
            background: var(--bg);
        }

        /* Animaciones */

        @keyframes appear {
            to {
                opacity: 1;
                transform: translateX(0) translateY(0);
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Móviles */

        @media (max-width: 480px) {
            :root {
                --panel-width: 290px;
            }

            #menu-toggle {
                top: 13px;
                left: 13px;
                width: 45px;
                height: 45px;
            }

            #panel-navegacion {
                width: min(88vw, 320px);
                padding: 75px 17px 20px;
            }

            #texto-inicial {
                padding: 22px;
            }

            .welcome-subtitle {
                font-size: 10px;
                letter-spacing: 2px;
            }

            .terminal-card {
                padding: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <button
        id="menu-toggle"
        type="button"
        title="Mostrar u ocultar menú"
        aria-label="Mostrar menú"
        aria-controls="panel-navegacion"
        aria-expanded="false">
        <i class="fas fa-gear" aria-hidden="true"></i>
    </button>

    <nav id="panel-navegacion"
         role="navigation"
         aria-label="Menú principal"
         aria-hidden="true"
         inert>

        <div class="panel-header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-terminal" aria-hidden="true"></i>
                </div>
                <div>
                    <div class="brand-title">DARK WEB</div>
                    <div class="brand-subtitle">CONTROL PANEL v3</div>
                </div>
            </div>
        </div>

        <div class="section-label">NAVEGACIÓN PRINCIPAL</div>

        <button class="boton-panel" type="button" data-url="#">
            <i class="fas fa-rocket" aria-hidden="true"></i>
            <span class="button-text">
                <span class="button-title">MÓDULO 01</span>
                <span class="button-description">Panel principal</span>
            </span>
            <i class="fas fa-chevron-right button-arrow" aria-hidden="true"></i>
        </button>

        <button class="boton-panel" type="button" data-url="#">
            <i class="fas fa-code" aria-hidden="true"></i>
            <span class="button-text">
                <span class="button-title">MÓDULO 02</span>
                <span class="button-description">Herramientas</span>
            </span>
            <i class="fas fa-chevron-right button-arrow" aria-hidden="true"></i>
        </button>

        <button class="boton-panel" type="button" data-url="#">
            <i class="fas fa-shield-halved" aria-hidden="true"></i>
            <span class="button-text">
                <span class="button-title">MÓDULO 03</span>
                <span class="button-description">Seguridad</span>
            </span>
            <i class="fas fa-chevron-right button-arrow" aria-hidden="true"></i>
        </button>

        <button class="boton-panel" type="button" data-url="#">
            <i class="fas fa-database" aria-hidden="true"></i>
            <span class="button-text">
                <span class="button-title">MÓDULO 04</span>
                <span class="button-description">Recursos</span>
            </span>
            <i class="fas fa-chevron-right button-arrow" aria-hidden="true"></i>
        </button>

        <hr class="panel-separator">

        <div class="section-label">ESTADO DEL SISTEMA</div>

        <div class="system-status">
            <span class="status-dot"></span>
            <span>Sistema iniciado</span>
        </div>

        <div id="boton-inicio">
            <button type="button"
                    title="Limpiar contenido y volver al inicio">
                <i class="fas fa-rotate-left" aria-hidden="true"></i>
                <span>VOLVER AL INICIO</span>
            </button>
        </div>
    </nav>

    <main id="area-contenido" role="main">

        <section id="texto-inicial">
            <i class="fas fa-terminal main-icon" aria-hidden="true"></i>

            <h1 class="welcome-label">DARK WEB</h1>

            <p class="welcome-subtitle">
                SISTEMA DE CONTROL
            </p>

            <div class="terminal-card">
                <div class="terminal-top">
                    <span class="terminal-circle"></span>
                    <span class="terminal-circle"></span>
                    <span class="terminal-circle"></span>
                    <span class="terminal-heading">SYSTEM TERMINAL</span>
                </div>

                <p class="terminal-line">
                    <strong>root@darkweb:~$</strong> system.init()
                </p>
                <p class="terminal-line">
                    [OK] Interfaz cargada
                </p>
                <p class="terminal-line">
                    [OK] Módulos preparados
                </p>
                <p class="terminal-line">
                    [READY] Esperando selección<span
                        style="color:#00ff88">_</span>
                </p>
            </div>

            <p class="welcome-hint">
                <i class="fas fa-hand-pointer" aria-hidden="true"></i>
                Abre el menú para seleccionar un módulo
            </p>
        </section>

        <iframe
            id="iframe-contenido"
            src="about:blank"
            title="Contenido del módulo"
            class="content-hidden"
            sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-presentation"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const menuToggle = document.getElementById('menu-toggle');
            const panel = document.getElementById('panel-navegacion');
            const botones = panel.querySelectorAll('.boton-panel');
            const iframe = document.getElementById('iframe-contenido');
            const inicio = document.getElementById('texto-inicial');
            const botonLimpiar = document.querySelector('#boton-inicio button');

            let contentTimer = null;

            function abrirPanel() {
                panel.classList.add('panel-visible');
                panel.setAttribute('aria-hidden', 'false');
                panel.inert = false;

                menuToggle.classList.add('icon-rotated');
                menuToggle.setAttribute('aria-expanded', 'true');
                menuToggle.setAttribute('aria-label', 'Ocultar menú');
            }

            function cerrarPanel() {
                panel.classList.remove('panel-visible');
                panel.setAttribute('aria-hidden', 'true');
                panel.inert = true;

                menuToggle.classList.remove('icon-rotated');
                menuToggle.setAttribute('aria-expanded', 'false');
                menuToggle.setAttribute('aria-label', 'Mostrar menú');
            }

            function alternarPanel() {
                if (panel.classList.contains('panel-visible')) {
                    cerrarPanel();
                } else {
                    abrirPanel();
                }
            }

            function volverAlInicio() {
                clearTimeout(contentTimer);
                cerrarPanel();

                iframe.classList.add('content-hidden');
                inicio.classList.add('content-hidden');

                contentTimer = setTimeout(function () {
                    iframe.src = 'about:blank';
                    inicio.classList.remove('content-hidden');
                }, 300);
            }

            function cargarModulo(url) {
                cerrarPanel();

                if (!url || url === '#') {
                    return;
                }

                /*
                 * Solo permite URL web HTTP/HTTPS.
                 * Los enlaces # quedan como botones de ejemplo.
                 */
                let destino;

                try {
                    destino = new URL(url, window.location.href);
                } catch (error) {
                    console.error('URL no válida:', error);
                    return;
                }

                if (!['http:', 'https:'].includes(destino.protocol)) {
                    console.error('Protocolo no permitido.');
                    return;
                }

                clearTimeout(contentTimer);
                inicio.classList.add('content-hidden');
                iframe.classList.add('content-hidden');

                contentTimer = setTimeout(function () {
                    iframe.src = destino.href;
                    iframe.classList.remove('content-hidden');
                }, 220);
            }

            menuToggle.addEventListener('click', alternarPanel);

            botones.forEach(function (boton) {
                boton.addEventListener('click', function () {
                    cargarModulo(boton.dataset.url);
                });
            });

            botonLimpiar.addEventListener('click', volverAlInicio);

            /* Cerrar el panel al pulsar fuera de él */
            document.addEventListener('click', function (event) {
                if (!panel.classList.contains('panel-visible')) {
                    return;
                }

                if (
                    !panel.contains(event.target) &&
                    !menuToggle.contains(event.target)
                ) {
                    cerrarPanel();
                }
            });

            /* Cerrar el menú con Escape */
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    cerrarPanel();
                }
            });

            /* Estado inicial */
            cerrarPanel();
            iframe.src = 'about:blank';
            iframe.classList.add('content-hidden');
            inicio.classList.remove('content-hidden');
        });
    </script>

</body>
</html>
