<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SLAYER MODZ - Licencia</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
  body{
    min-height:100vh;
    background: linear-gradient(to bottom, #000000 0%, #000000 45%, #4d0000 70%, #b30000 100%);
    display:flex; justify-content:center; align-items:center;
    padding:20px; color:white;
  }
  .card{width:100%; max-width:420px; text-align:center;}
  .box{
    background: rgba(0,0,0,.65);
    border:1px solid #330000;
    border-radius:14px; padding:22px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    text-align:center;
  }
  .label{font-size:12px; letter-spacing:2px; color:#ccc; margin-bottom:14px;}
  .key-box{
    background:#000; border:1px dashed #ff0000;
    padding:18px 10px; border-radius:10px; margin-bottom:15px;
  }
  #keyText{
    font-family:'Orbitron', monospace;
    font-size:20px; font-weight:700; letter-spacing:1px;
    color:#ff5555; word-break:break-all; line-height:1.4;
  }
  .btn{
    width:100%; height:52px; border:none; cursor:pointer;
    font-weight:bold; font-size:15px; letter-spacing:1px;
    background:#FF0000; color:white;
  }
  .btn:active{transform:scale(.98);}
  #msg{margin-top:12px; font-size:14px; font-weight:bold; min-height:20px; color:#00ff88;}
  .info{margin-top:14px; font-size:12px; color:#aaa; line-height:1.5;}
  footer{margin-top:18px; font-size:11px; color:#999; text-align:center;}
</style>
</head>
<body>

<div class="card">
  <div class="box">
    <div class="label">TU LICENCIA ES:</div>

    <div class="key-box">
      <div id="keyText">SLAYER-H482-HE391</div>
    </div>

    <button class="btn" onclick="copiar()">COPIAR KEY</button>
    <div id="msg"></div>

    <div class="info">Copia esta key y pégala en la app<br>en INGRESA TU KEY para activar tu licencia.</div>
  </div>

  <footer>© 2026 THE SLAYER MODZ - Todos los derechos reservados</footer>
</div>

<script>
  const keyGenerada = "SLAYER-H482-HE391";
  function copiar(){
    navigator.clipboard.writeText(keyGenerada).then(()=>{
      document.getElementById("msg").innerText = "📋 Copiada al portapapeles";
    });
  }
</script>

</body>
</html>
