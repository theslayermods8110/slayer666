workflows:
  maui-android:
    name: MAUI Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    scripts:
      - name: Install MAUI workload
        script: dotnet workload install maui
      - name: Build APK
        script: dotnet build -f net8.0-android -c Release
    artifacts:
      - '**/*.apk'
