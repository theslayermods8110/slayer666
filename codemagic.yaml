workflows:
  maui-android:
    name: MAUI Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    scripts:
      - name: Build APK
        script: |
          export PATH=/usr/local/share/dotnet:$PATH
          which dotnet
          dotnet --info
          dotnet workload install maui
          dotnet build -f net8.0-android -c Release
    artifacts:
      - '**/*.apk'
